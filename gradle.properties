org.gradle.jvmargs=-Xmx2G -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

minecraft_version=1.21.1
enabled_platforms=fabric,neoforge

mod_id=bluerecipebook
mod_name=Blue Recipe Book
mod_version=0.1.0
mod_group=dev.bluerecipebook
mod_license=All Rights Reserved
mod_description=A progression recipe book.

# Separate several names with commas. Fabric lists each name. NeoForge keeps the line.
# mod_contributors is NeoForge credits and Fabric contributors. mod_sources is Fabric only.
mod_authors=Phoenix_IV
mod_contributors=
mod_homepage=https://github.com/PhoenixIV/Blue-Recipe-Book
mod_issues=https://github.com/PhoenixIV/Blue-Recipe-Book/issues
mod_sources=https://github.com/PhoenixIV/Blue-Recipe-Book

architectury_version=13.0.11
yacl_version=3.8.1
# YACL 3.8.1's Fabric jar was built with Loom 1.13. This project uses Loom 1.11.
loom.ignoreDependencyLoomVersionValidation=true
modmenu_version=11.0.3
jei_version=19.44.0.401
fabric_loader_version=0.16.14
fabric_api_version=0.116.6+1.21.1
neoforge_version=21.1.233

minecraft_version_range=[1.21.1]
loader_version_range=[1,)
neoforge_version_range=[21.1,)
