modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "${mod_issues}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
displayURL = "${mod_homepage}"
credits = "${mod_contributors}"
description = "${mod_description}"
logoFile = "icon.png"
logoBlur = false

[[mixins]]
config = "bluerecipebook.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "architectury"
type = "required"
versionRange = "[${architectury_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "yet_another_config_lib_v3"
type = "required"
versionRange = "[${yacl_version}+${minecraft_version}-neoforge,)"
ordering = "AFTER"
side = "CLIENT"
